<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5F96"/>
      <stop offset="100%" stop-color="#0D3F6F"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines Background -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Outer Energy Circle Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-dasharray="16 12"/>

  <!-- Battery Container -->
  <g filter="url(#shadow)">
    <!-- Battery Cap -->
    <rect x="232" y="112" width="48" height="20" rx="6" fill="#E2E8F0"/>
    <!-- Battery Body -->
    <rect x="156" y="132" width="200" height="260" rx="32" fill="none" stroke="#FFFFFF" stroke-width="20"/>
    <!-- Battery Level -->
    <rect x="176" y="220" width="160" height="152" rx="18" fill="url(#energyGrad)"/>
  </g>

  <!-- Lightning Bolt Symbol -->
  <path d="M 276 160 L 210 270 L 260 270 L 236 352 L 312 238 L 262 238 Z" fill="url(#boltGrad)" filter="url(#shadow)"/>
</svg>
