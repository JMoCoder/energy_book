  <style>
    /* ── CSS Variables ─────────────────────────────────────────── */
    :root {
      --c-primary:#1A5F96; --c-primary-dark:#0D3F6F; --c-primary-light:#E8F2FF;
      --c-bg:#F8FAFF; --c-card:#FFFFFF; --c-border:#E2E8F0;
      --c-text:#1A1A2E; --c-muted:#718096; --c-sec:#4A5568;
      --font-body:'Noto Sans SC','PingFang SC',sans-serif;
      --font-ui:'Inter','Noto Sans SC',sans-serif;
      --font-mono:'JetBrains Mono',monospace;
      --radius:12px; --radius-lg:20px;
      --shadow:0 4px 16px rgba(0,0,0,0.07);
      --shadow-lg:0 12px 40px rgba(0,0,0,0.1);
      --transition:0.22s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:16px}
    body{font-family:var(--font-body);color:var(--c-text);background:var(--c-bg);line-height:1.7;min-height:100vh}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;background:none;font-family:inherit}

    /* ── Site Header ────────────────────────────────────────────── */
    .site-header{
      position:sticky;top:0;z-index:200;
      background:rgba(255,255,255,0.93);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--c-border);
      box-shadow:0 1px 8px rgba(0,0,0,0.05);
    }
    .header-inner{
      max-width:1200px;margin:0 auto;padding:0 2rem;
      height:60px;display:flex;align-items:center;gap:1.5rem;
    }
    .site-logo{
      display:flex;align-items:center;gap:0.6rem;
      font-family:var(--font-ui);font-weight:900;font-size:1.05rem;
      color:var(--c-primary);white-space:nowrap;
    }
    .logo-icon{font-size:1.3rem}
    .header-search{
      flex:1;max-width:720px;position:relative;
    }
    .search-input{
      width:100%;padding:0.5rem 1rem 0.5rem 2.6rem;
      border:1.5px solid var(--c-border);border-radius:30px;
      font-size:0.875rem;font-family:var(--font-body);
      background:var(--c-bg);color:var(--c-text);
      transition:border-color var(--transition),box-shadow var(--transition);
      outline:none;
    }
    .search-input:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(26,95,150,0.1)}
    .search-icon{
      position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);
      color:var(--c-muted);font-size:0.95rem;pointer-events:none;
    }
    .header-stats{
      display:flex;align-items:center;gap:1.25rem;
      font-family:var(--font-ui);font-size:0.8rem;color:var(--c-muted);
      white-space:nowrap;
    }
    .stat-pill{
      display:flex;align-items:center;gap:0.35rem;
      background:var(--c-primary-light);color:var(--c-primary);
      padding:0.25rem 0.7rem;border-radius:20px;font-weight:600;
    }
    .progress-global{
      display:flex;align-items:center;gap:0.6rem;
    }
    .progress-ring-wrap{position:relative;width:36px;height:36px}
    .progress-ring-svg{transform:rotate(-90deg)}
    .progress-ring-bg{stroke:#E2E8F0;fill:none;stroke-width:3}
    .progress-ring-fill{stroke:var(--c-primary);fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 0.5s ease}
    .progress-ring-text{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:0.6rem;font-weight:700;color:var(--c-primary);font-family:var(--font-ui);
    }

    /* ── Hero ────────────────────────────────────────────────────── */
    .hero{
      background:linear-gradient(135deg,#0D3F6F 0%,#1A5F96 45%,#1E7AC4 100%);
      color:white;padding:5rem 2rem 4rem;text-align:center;
      position:relative;overflow:hidden;
    }
    .hero::before{
      content:'';position:absolute;inset:0;
      background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:0.5rem;
      background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
      padding:0.35rem 1rem;border-radius:20px;font-size:0.8rem;
      font-family:var(--font-ui);margin-bottom:1.5rem;
      backdrop-filter:blur(8px);
    }
    .hero h1{
      font-family:var(--font-ui);font-size:clamp(2rem,5vw,3.2rem);
      font-weight:900;line-height:1.15;margin-bottom:0.75rem;
      text-shadow:0 2px 16px rgba(0,0,0,0.2);
    }
    .hero-sub{
      font-size:1.1rem;opacity:0.85;margin-bottom:2.5rem;max-width:560px;margin-left:auto;margin-right:auto;
    }
    .hero-stats{
      display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:0.5rem;
    }
    .hero-stat{
      background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
      padding:0.9rem 1.5rem;border-radius:var(--radius);
      backdrop-filter:blur(8px);min-width:120px;
    }
    .hero-stat-num{
      font-family:var(--font-ui);font-size:1.75rem;font-weight:900;
      display:block;line-height:1;margin-bottom:0.3rem;
    }
    .hero-stat-label{font-size:0.78rem;opacity:0.8}

    /* ── Main Layout ─────────────────────────────────────────────── */
    .main-wrap{max-width:1200px;margin:0 auto;padding:3rem 2rem 5rem}

    /* ── Section Title ───────────────────────────────────────────── */
    .section-title{
      display:flex;align-items:center;gap:0.75rem;
      font-family:var(--font-ui);font-size:1.2rem;font-weight:700;
      color:var(--c-text);margin-bottom:1.75rem;
    }
    .section-title::after{
      content:'';flex:1;height:1px;background:var(--c-border);
    }

    /* ── Level Grid ──────────────────────────────────────────────── */
    .level-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:1.25rem;margin-bottom:3.5rem;
    }
    .level-card{
      background:var(--c-card);border:1px solid var(--c-border);
      border-radius:var(--radius-lg);padding:1.5rem;
      box-shadow:var(--shadow);cursor:pointer;
      transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition);
      position:relative;overflow:hidden;
    }
    .level-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:4px;
      background:var(--level-color);
    }
    .level-card:hover{
      transform:translateY(-3px);box-shadow:var(--shadow-lg);
      border-color:var(--level-color);
    }
    .level-card.active{ border-color:var(--level-color); box-shadow:0 0 0 2px var(--level-color); }
    .level-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.85rem}
    .level-badge{
      display:inline-flex;align-items:center;gap:0.4rem;
      padding:0.25rem 0.7rem;border-radius:20px;
      font-family:var(--font-ui);font-size:0.72rem;font-weight:700;
      background:color-mix(in srgb,var(--level-color) 12%,transparent);
      color:var(--level-color);
    }
    .level-sections-count{
      font-family:var(--font-mono);font-size:0.75rem;color:var(--c-muted);
    }
    .level-card h3{
      font-size:1.05rem;font-weight:700;color:var(--c-text);
      margin-bottom:0.35rem;line-height:1.3;
    }
    .level-card p{font-size:0.8rem;color:var(--c-muted);line-height:1.5;margin-bottom:1rem}
    .level-progress-bar{
      height:5px;background:var(--c-border);border-radius:3px;overflow:hidden;margin-bottom:0.6rem;
    }
    .level-progress-fill{
      height:100%;background:var(--level-color);border-radius:3px;
      transition:width 0.6s ease;
    }
    .level-progress-text{
      display:flex;justify-content:space-between;
      font-size:0.72rem;color:var(--c-muted);font-family:var(--font-ui);
    }
    .level-card-footer{
      display:flex;align-items:center;justify-content:space-between;margin-top:0.75rem;
    }
    .level-open-btn{
      font-size:0.78rem;color:var(--level-color);font-weight:600;
      font-family:var(--font-ui);display:flex;align-items:center;gap:0.3rem;
    }
    .level-open-icon{transition:transform var(--transition)}
    .level-card.active .level-open-icon{transform:rotate(90deg)}

    /* ── Level Expand Panel ──────────────────────────────────────── */
    .level-panel{
      display:none;background:var(--c-card);border:1px solid var(--c-border);
      border-radius:var(--radius-lg);margin-bottom:2rem;
      overflow:hidden;box-shadow:var(--shadow);
    }
    .level-panel.open{display:block;animation:slideDown 0.25s ease}
    @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .level-panel-header{
      padding:1.25rem 1.75rem;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--c-border);
      background:linear-gradient(135deg,color-mix(in srgb,var(--level-color) 6%,transparent),transparent);
    }
    .level-panel-title{font-size:1.1rem;font-weight:700;color:var(--c-text)}
    .level-panel-close{
      width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      color:var(--c-muted);transition:background var(--transition);font-size:1.2rem;
    }
    .level-panel-close:hover{background:var(--c-border)}
    .chapters-list{padding:1rem 1.75rem}
    .chapter-group{margin-bottom:1.25rem}
    .chapter-group-title{
      font-size:0.78rem;font-weight:700;color:var(--c-muted);
      text-transform:uppercase;letter-spacing:0.06em;
      padding:0.5rem 0;border-bottom:1px solid var(--c-border-light,#EDF2F7);
      margin-bottom:0.6rem;
      display:flex;align-items:center;gap:0.5rem;
    }
    .chapter-group-num{
      width:22px;height:22px;border-radius:50%;
      background:color-mix(in srgb,var(--level-color) 15%,transparent);
      color:var(--level-color);font-size:0.7rem;font-weight:700;
      display:flex;align-items:center;justify-content:center;
    }
    .sections-grid{display:flex;flex-wrap:wrap;gap:0.5rem}
    .section-chip{
      display:inline-flex;align-items:center;gap:0.4rem;
      padding:0.35rem 0.8rem;border-radius:8px;font-size:0.8rem;
      border:1px solid var(--c-border);transition:all var(--transition);
      position:relative;
    }
    .section-chip.available{
      background:var(--c-card);color:var(--c-text);cursor:pointer;
    }
    .section-chip.available:hover{
      border-color:var(--level-color);background:color-mix(in srgb,var(--level-color) 8%,transparent);
      color:var(--level-color);transform:translateY(-1px);
    }
    .section-chip.planned{
      background:#FAFAFA;color:var(--c-muted);cursor:default;
      border-style:dashed;
    }
    .section-chip.completed{
      background:color-mix(in srgb,var(--level-color) 10%,transparent);
      border-color:var(--level-color);color:var(--level-color);
    }
    .chip-icon{font-size:0.7rem}
    .chip-diff{font-size:0.65rem;opacity:0.7}

    /* ── Search Results ──────────────────────────────────────────── */
    #search-results{
      display:none;margin-bottom:2rem;
    }
    #search-results.visible{ display:block; }
    .search-result-list{
      display:flex;flex-direction:column;gap:0.5rem;
    }
    .search-result-item{
      display:flex;align-items:center;gap:1rem;
      padding:0.75rem 1.25rem;background:var(--c-card);
      border:1px solid var(--c-border);border-radius:var(--radius);
      transition:all var(--transition);
    }
    .search-result-item:hover{border-color:var(--c-primary);box-shadow:var(--shadow)}
    .result-level-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .result-title{font-size:0.9rem;font-weight:500;flex:1}
    .result-path{font-size:0.75rem;color:var(--c-muted);font-family:var(--font-mono)}
    .result-link{
      font-size:0.78rem;color:var(--c-primary);font-weight:600;
      padding:0.25rem 0.6rem;border:1px solid currentColor;border-radius:6px;
      white-space:nowrap;
    }
    .result-link.locked{color:var(--c-muted);border-color:var(--c-border);cursor:default}
    .no-results{text-align:center;padding:2rem;color:var(--c-muted);font-size:0.9rem}

    /* ── Progress Summary ────────────────────────────────────────── */
    .progress-summary{
      background:var(--c-card);border:1px solid var(--c-border);
      border-radius:var(--radius-lg);padding:1.75rem 2rem;
      margin-bottom:2.5rem;box-shadow:var(--shadow);
    }
    .progress-bars{display:flex;flex-direction:column;gap:0.6rem;margin-top:1rem}
    .prog-row{display:grid;grid-template-columns:140px 1fr 48px;align-items:center;gap:0.75rem}
    .prog-name{font-size:0.8rem;color:var(--c-sec);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .prog-bar{height:6px;background:var(--c-border);border-radius:3px;overflow:hidden}
    .prog-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
    .prog-pct{font-size:0.72rem;color:var(--c-muted);font-family:var(--font-ui);text-align:right}

    /* ── Footer ──────────────────────────────────────────────────── */
    .site-footer{
      text-align:center;padding:2.5rem 2rem;
      border-top:1px solid var(--c-border);
      font-size:0.8rem;color:var(--c-muted);
    }
    .site-footer a{color:var(--c-primary)}

    /* ── Back to Top ─────────────────────────────────────────────── */
    #btnTop{
      position:fixed;bottom:2rem;right:2rem;width:44px;height:44px;
      border-radius:50%;background:var(--c-primary);color:white;
      box-shadow:0 4px 16px rgba(26,95,150,0.35);
      opacity:0;transform:translateY(10px);
      transition:opacity 0.25s,transform 0.25s;
      z-index:99;font-size:1.1rem;
      display:flex;align-items:center;justify-content:center;
    }
    #btnTop.visible{opacity:1;transform:translateY(0)}
    #btnTop:hover{background:#0D3F6F;transform:translateY(-2px) !important}

    /* ── Responsive ──────────────────────────────────────────────── */
    @media(max-width:900px){
      .header-stats{display:none}
      .level-grid{grid-template-columns:1fr 1fr}
      .prog-row{grid-template-columns:90px 1fr 36px}
    }
    @media(max-width:600px){
      .hero{padding:3rem 1.25rem 2.5rem}
      .hero h1{font-size:1.75rem}
      .level-grid{grid-template-columns:1fr}
      .header-search{display:none}
      .main-wrap{padding:2rem 1rem 4rem}
      .chapters-list{padding:1rem}
    }
  </style>
</head>
<body>

<!-- ── Site Header ─────────────────────────────────────────────── -->
<header class="site-header">

<!-- ── JavaScript ───────────────────────────────────────────────── -->
<script>
(function () {
  'use strict';

  // ── 状态 ────────────────────────────────────────────────────
  let tocData = null;
  let progress = {};
  let activeLevel = null;
  let searchIndex = [];  // [{id,title,levelId,levelColor,levelLabel,file,chapterTitle,levelDir}]

  // ── 读取与同步进度（双路备份） ──────────────────────────────
  function normalizeProgressKeys(data) {
    if (!data || typeof data !== 'object') return {};
    const normalized = {};
    for (const key in data) {
      let decodedKey = key;
      try {
        decodedKey = decodeURIComponent(key);
      } catch (e) {}
      if (!normalized[decodedKey]) {
        normalized[decodedKey] = data[key];
      } else {
        normalized[decodedKey] = {
          ...normalized[decodedKey],
          ...data[key],
          completed: normalized[decodedKey].completed || data[key].completed,
          questions: Array.from(new Set([
            ...(normalized[decodedKey].questions || []),
            ...(data[key].questions || [])
          ]))
        };
      }
    }
    return normalized;
  }

  function getLocalProgress() {
    try {
      const raw = JSON.parse(localStorage.getItem('bess_progress') || '{}');
      return normalizeProgressKeys(raw);
    } catch(e) { return {}; }
  }

  function setLocalProgress(data) {
    try { localStorage.setItem('bess_progress', JSON.stringify(data)); } catch (e) {}
  }

  // 优先尝试容器端 API (/api/progress)，失败静默回退 localStorage
  async function fetchProgressServer() {
    const localData = getLocalProgress();
    try {
      const res = await fetch('/api/progress', { cache: 'no-cache' });
      if (res.ok) {
        const json = await res.json();
        if (json && json.success && json.progress) {
          const merged = normalizeProgressKeys({ ...localData, ...json.progress });
          setLocalProgress(merged);
          return merged;
        }
      }
    } catch (e) {
      // 容器 API 未启动或静态模式，降级回退 localStorage
    }
    return localData;
  }

  function getProgress() {
    return normalizeProgressKeys(progress && Object.keys(progress).length > 0 ? progress : getLocalProgress());
  }

  function countCompleted(tocData) {
    const prog = getProgress();
    let n = 0;
    tocData.levels.forEach(lv => {
      lv.chapters.forEach(ch => {
        ch.sections.forEach(sec => {
          const key = sec.file.replace('.html','');
          if (prog[key] && prog[key].completed) n++;
        });
      });
    });
    return n;
  }

  function countLevelCompleted(lv) {
    const prog = getProgress();
    let n = 0;
    lv.chapters.forEach(ch => {
      ch.sections.forEach(sec => {
        const key = sec.file.replace('.html','');
        if (prog[key] && prog[key].completed) n++;
      });
    });
    return n;
  }

  function getSectionStatus(sec) {
    const prog = getProgress();
    const key = sec.file.replace('.html','');
    if (sec.status === 'planned') return 'planned';
    if (prog[key] && prog[key].completed) return 'completed';
    return 'available';
  }

  // ── 渲染进度条 ────────────────────────────────────────────────
  function renderProgressBars(toc) {
    const container = document.getElementById('progressBars');
    if (!container) return;
    let html = '';
    toc.levels.forEach(lv => {
      const done = countLevelCompleted(lv);
      const total = lv.sections;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      html += `<div class="prog-row">
        <div class="prog-name" title="${lv.title}">${lv.label}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${lv.color}"></div></div>
        <div class="prog-pct">${done}/${total}</div>
      </div>`;
    });
    container.innerHTML = html;
  }

  // ── 渲染 Header 进度环 ────────────────────────────────────────
  function renderGlobalProgress(total, completed) {
    const pct = total > 0 ? (completed / total) : 0;
    const circ = 97.39;
    const fill = document.getElementById('progressRingFill');
    const pctEl = document.getElementById('progressRingPct');
    const pill = document.getElementById('completedPill');
    const heroComp = document.getElementById('heroCompleted');
    if (fill) fill.style.strokeDashoffset = circ * (1 - pct);
    if (pctEl) pctEl.textContent = Math.round(pct * 100) + '%';
    if (pill) pill.textContent = completed + ' / ' + total;
    if (heroComp) heroComp.textContent = completed;
  }

  // ── 构建搜索索引 ─────────────────────────────────────────────
  function buildSearchIndex(toc) {
    const idx = [];
    toc.levels.forEach(lv => {
      const dir = lv.id === 'appendix' ? 'appendix' : lv.id;
      lv.chapters.forEach(ch => {
        ch.sections.forEach(sec => {
          idx.push({
            id: sec.id,
            title: sec.title,
            file: sec.file,
            status: sec.status,
            difficulty: sec.difficulty,
            levelId: lv.id,
            levelDir: dir,
            levelColor: lv.color,
            levelLabel: lv.label,
            levelTitle: lv.title,
            chapterTitle: ch.title
          });
        });
      });
    });
    return idx;
  }

  // ── 渲染 Level 卡片 ───────────────────────────────────────────
  function renderLevelGrid(toc) {
    const grid = document.getElementById('levelGrid');
    const panels = document.getElementById('levelPanels');
    if (!grid || !panels) return;

    let gridHtml = '';
    let panelHtml = '';

    toc.levels.forEach(lv => {
      const done = countLevelCompleted(lv);
      const total = lv.sections;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      const availCount = lv.chapters.reduce((a, ch) =>
        a + ch.sections.filter(s => s.status !== 'planned').length, 0);

      gridHtml += `
      <div class="level-card" id="card-${lv.id}"
        style="--level-color:${lv.color}"
        onclick="toggleLevel('${lv.id}')">
        <div class="level-card-head">
          <span class="level-badge">${lv.label}</span>
          <span class="level-sections-count">${total}节</span>
        </div>
        <h3>${lv.title}</h3>
        <p>${lv.subtitle}</p>
        <div class="level-progress-bar">
          <div class="level-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="level-progress-text">
          <span>${done}/${total} 完成</span>
          <span>${availCount > 0 ? availCount + '节可读' : '即将上线'}</span>
        </div>
        <div class="level-card-footer">
          <span class="level-open-btn">
            展开章节 <span class="level-open-icon">▶</span>
          </span>
        </div>
      </div>`;

      // ── 展开面板 ──────────────────────────────────
      let chaptersHtml = '';
      lv.chapters.forEach(ch => {
        let sectionsHtml = '';
        ch.sections.forEach(sec => {
          const status = getSectionStatus(sec);
          const href = status !== 'planned'
            ? `chapters/${lv.id}/${sec.file}`
            : '#';
          const icon = status === 'completed' ? '✅'
                     : status === 'available' ? '📖' : '🔒';
          sectionsHtml += `
            <${status !== 'planned' ? 'a href="' + href + '"' : 'span'}
              class="section-chip ${status}"
              title="${sec.title}">
              <span class="chip-icon">${icon}</span>
              <span>${sec.title}</span>
              <span class="chip-diff">${sec.difficulty}</span>
            </${status !== 'planned' ? 'a' : 'span'}>`;
        });

        chaptersHtml += `
          <div class="chapter-group">
            <div class="chapter-group-title">
              <span class="chapter-group-num">${ch.no}</span>
              ${ch.title}
            </div>
            <div class="sections-grid">${sectionsHtml}</div>
          </div>`;
      });

      panelHtml += `
      <div class="level-panel" id="panel-${lv.id}" style="--level-color:${lv.color}">
        <div class="level-panel-header">
          <span class="level-panel-title">${lv.label} · ${lv.title}</span>
          <button class="level-panel-close" onclick="toggleLevel('${lv.id}')">✕</button>
        </div>
        <div class="chapters-list">${chaptersHtml}</div>
      </div>`;
    });

    grid.innerHTML = gridHtml;
    panels.innerHTML = panelHtml;
  }

  // ── 切换展开面板 ─────────────────────────────────────────────
  window.toggleLevel = function(id) {
    const panel = document.getElementById('panel-' + id);
    const card  = document.getElementById('card-' + id);
    if (!panel || !card) return;

    if (activeLevel && activeLevel !== id) {
      const oldPanel = document.getElementById('panel-' + activeLevel);
      const oldCard  = document.getElementById('card-' + activeLevel);
      if (oldPanel) oldPanel.classList.remove('open');
      if (oldCard)  oldCard.classList.remove('active');
    }

    const isOpen = panel.classList.toggle('open');
    card.classList.toggle('active', isOpen);
    activeLevel = isOpen ? id : null;

    if (isOpen) {
      setTimeout(() => {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }
  };

  // ── 搜索 ─────────────────────────────────────────────────────
  function initSearch() {
    const input = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('search-results');
    const resultList = document.getElementById('searchResultList');
    const levelGridTitle = document.getElementById('levelGridTitle');
    if (!input) return;

    input.addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      if (!q) {
        resultsDiv.classList.remove('visible');
        levelGridTitle.style.display = '';
        return;
      }
      const hits = searchIndex.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.chapterTitle.toLowerCase().includes(q) ||
        s.levelTitle.toLowerCase().includes(q)
      ).slice(0, 20);

      levelGridTitle.style.display = 'none';
      resultsDiv.classList.add('visible');

      if (!hits.length) {
        resultList.innerHTML = '<div class="no-results">🔎 未找到匹配内容，请尝试其他关键词</div>';
        return;
      }

      let html = '';
      hits.forEach(h => {
        const status = getSectionStatus(h);
        const href = status !== 'planned' ? `chapters/${h.levelDir}/${h.file}` : '#';
        html += `<div class="search-result-item">
          <div class="result-level-dot" style="background:${h.levelColor}"></div>
          <div style="flex:1;min-width:0">
            <div class="result-title">${h.title}</div>
            <div class="result-path">${h.levelLabel} › ${h.chapterTitle}</div>
          </div>
          <span class="chip-diff">${h.difficulty}</span>
          ${status !== 'planned'
            ? `<a href="${href}" class="result-link">开始阅读</a>`
            : `<span class="result-link locked">即将上线</span>`}
        </div>`;
      });
      resultList.innerHTML = html;
    });
  }

  async function init() {
    try {
      // 优先尝试 fetch（服务器模式），失败则用内嵌数据
      const resp = await fetch('data/toc.json');
      tocData = await resp.json();
    } catch(e) {
      tocData = _INLINE_TOC;
    }

    // 优先：同步容器端进度 API，降级：回退至浏览器缓存
    progress = await fetchProgressServer();
    searchIndex = buildSearchIndex(tocData);

    const completed = countCompleted(tocData);
    const total = tocData.meta.totalSections;

    renderGlobalProgress(total, completed);
    renderProgressBars(tocData);
    renderLevelGrid(tocData);
    initSearch();
  }

  // ── 返回顶端按钮 ─────────────────────────────────────────────
  window.addEventListener('scroll', () => {
    document.getElementById('btnTop').classList.toggle('visible', scrollY > 400);
  }, { passive: true });

  async function refreshUIProgress() {
    progress = await fetchProgressServer();
    if (!tocData) return;
    const completed = countCompleted(tocData);
    renderGlobalProgress(tocData.meta.totalSections, completed);
    renderProgressBars(tocData);
    renderLevelGrid(tocData);
  }

  // ── 监听章节完成消息（跨窗口/iframe/广播/存储） ────────────
  window.addEventListener('message', async e => {
    if (e.data && e.data.type === 'section_complete') {
      await refreshUIProgress();
    }
  });

  // 广播频道监听
  try {
    if ('BroadcastChannel' in window) {
      const bc = new BroadcastChannel('bess_progress_channel');
      bc.onmessage = async (e) => {
        if (e.data && e.data.type === 'section_complete') {
          await refreshUIProgress();
        }
      };
    }
  } catch (e) {}

  // 页面从历史缓存(bfcache)恢复或后退时自动刷新进度
  window.addEventListener('pageshow', async (e) => {
    if (e.persisted || performance.navigation.type === 2) {
      await refreshUIProgress();
    }
  });

  // 监听同域 LocalStorage 变化
  window.addEventListener('storage', async (e) => {
    if (e.key === 'bess_progress') {
      await refreshUIProgress();
    }
  });

  document.addEventListener('DOMContentLoaded', init);
})();
